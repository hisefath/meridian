[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
# size over speed: smaller program = less deploy rent; matching cost stays far under the CU limit
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
